<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>안내</title>
    <script>
      // Keep project hashes and query parameters when loading the root app.
      if (/^\/(?:portfolio|[a-f0-9]{24})\/?$/.test(window.location.pathname)) {
        const requested = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?__portfolio_route=' + encodeURIComponent(requested));
      }
    </script>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c111b;
        color: #e8edf5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.35rem; font-weight: 600; }
      p { color: #b1bdcd; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>전달받은 링크로 접속해 주세요.</h1>
      <p>주소를 확인한 후 다시 방문해 주세요.</p>
    </main>
  </body>
</html>
